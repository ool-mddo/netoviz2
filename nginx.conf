# netoviz2: static files (SPA) under /netoviz2/
# The API (/topologies/...) is not served here. The browser calls it on the same origin (api-proxy).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # redirects keep the host and port of the client (api-proxy does not forward the Host header)
    absolute_redirect off;

    # requests come through api-proxy (HTTP/1.0 to the upstream), so compress them too
    gzip on;
    gzip_http_version 1.0;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    location = /netoviz2 {
        return 301 /netoviz2/;
    }

    # files with a hash in the name
    location /netoviz2/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # the other paths are pages of the SPA (handled by the router in the browser)
    location /netoviz2/ {
        add_header Cache-Control "no-cache";
        try_files $uri /netoviz2/index.html;
    }
}

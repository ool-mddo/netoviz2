<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>netoviz2</title>
    <!-- simplified icon of the ool-mddo organization: svg for the modern browsers, ico as a fallback (the base path /netoviz2/ is added by the build) -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <script>
      // apply the theme chosen by the user before the page is drawn (to avoid a flash of the other theme)
      try {
        var theme = localStorage.getItem('netoviz2.theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
      } catch (e) {
        // the storage is not available: the setting of the browser is used
      }
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
